<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Checkout | Zemba Music Co</title>
  <meta name="description" content="Secure card checkout for Zemba Music Co, processed by Stripe.">
  <!-- Embedded Stripe Checkout form. Needs the /api/create-checkout-session Pages Function, so it only
       works once the site is served by Cloudflare Pages; on GitHub Pages it falls back to /pay/.
       Not linked from the nav or /pay/ until then, and kept out of search results. -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://zembamusicco.com/pay/checkout/">
  <link rel="icon" type="image/png" href="/assets/photos/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/tw.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Copied from index.html (each page carries its own inline brand rules) */
    .text-fire-grad { background: linear-gradient(92deg,#ffb27e,#ee5a20 60%,#cf470f); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
    .eyebrow { letter-spacing:.20em; }
    .card-surface { background-image: linear-gradient(to bottom, rgba(255,255,255,0.055), rgba(255,255,255,0.012)); border: 1px solid rgba(255,255,255,0.09); box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.07); }
    .link-underline { background-image: linear-gradient(#ff7a3d,#ff7a3d); background-size:0% 2px; background-repeat:no-repeat; background-position:0 100%; transition:background-size .3s; }
    .link-underline:hover { background-size:100% 2px; }
  </style>
  <!-- Stripe.js must load from js.stripe.com (PCI): never bundle or self-host it. -->
  <script src="https://js.stripe.com/dahlia/stripe.js"></script>
</head>
<body class="bg-midnight-950 text-slate-100 font-sans antialiased">
  <main class="max-w-3xl mx-auto px-4 sm:px-6 py-12 md:py-20">
    <a href="/pay/" class="inline-flex items-center gap-2 text-sm text-slate-400 hover:text-fire-400 transition"><i class="fa-solid fa-arrow-left text-xs"></i> All payment options</a>

    <p class="eyebrow text-[11px] font-display font-600 uppercase text-fire-400 mt-8 mb-3">Secure checkout &middot; processed by Stripe</p>
    <h1 class="font-display font-700 uppercase text-balance text-[clamp(1.875rem,1.1rem+3.4vw,3.5rem)] leading-[0.95] tracking-[-0.01em]">Pay by <span class="text-fire-grad">card</span></h1>

    <section class="mt-10 rounded-2xl card-surface p-4 sm:p-8">
      <div id="checkout-form"></div>
      <p id="checkout-status" class="text-sm text-slate-400" role="status">Loading secure checkout&hellip;</p>
    </section>
  </main>

  <script>
    // Publishable keys are safe to ship in the page. Replace per STRIPE_INTEGRATION_TODO.md.
    const STRIPE_PUBLISHABLE_KEY = 'pk_test_...';

    const appearance = {
      "theme": "night",
      "labels": "auto",
      "inputs": "spaced",
      "variables": {
        "borderRadius": "4px",
        "colorBackground": "#ffffff",
        "colorDanger": "#df1b41",
        "colorPrimary": "#0570de",
        "colorSuccess": "#00c853",
        "colorText": "#30313d",
        "fontFamily": "default",
        "fontSizeBase": "16px",
        "spacingUnit": "4px"
      }
    };

    const statusEl = document.getElementById('checkout-status');
    const showFallback = () => {
      statusEl.innerHTML = 'Online card checkout isn&rsquo;t available right now. Please use the secure link in your invoice email, or see <a href="/pay/" class="text-azure-300 link-underline">all payment options</a>.';
    };

    async function initCheckout() {
      const clientSecret = fetch('/api/create-checkout-session', { method: 'POST' })
        .then((response) => {
          if (!response.ok) throw new Error('Checkout endpoint returned ' + response.status);
          return response.json();
        })
        .then((json) => json.client_secret);

      // Surface endpoint failures (e.g. the static host has no /api) instead of a blank form.
      clientSecret.catch((error) => {
        console.error('Could not create Checkout Session:', error);
        showFallback();
      });

      const stripe = Stripe(STRIPE_PUBLISHABLE_KEY);
      const checkout = stripe.initCheckoutFormSdk({ clientSecret, appearance });

      const form = checkout.createForm({ layout: 'expanded' });
      form.mount('#checkout-form');

      const loadActionsResult = await checkout.loadActions();
      if (loadActionsResult.type === 'success') {
        statusEl.textContent = '';
        form.on('confirm', async (event) => {
          try {
            await loadActionsResult.actions.confirm({ formConfirmEvent: event });
          } catch (error) {
            console.error('Payment confirmation error:', error);
          }
        });
      }
    }

    if (typeof Stripe === 'function') {
      initCheckout().catch((error) => {
        console.error('Checkout failed to initialize:', error);
        showFallback();
      });
    } else {
      showFallback();
    }
  </script>
</body>
</html>
